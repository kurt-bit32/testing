<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">

  </head>

  <body style="background-color: hsl(122, 87%, 22%)"
    style="width: 100%; height: 100vh" class="d-flex flex-column align-items-center justify-content-center gap-3 " >
      <div>
          <img src="Logo-NVIDIA.png" alt="NVIDIA Logo" width="auto" height="100px" style="display: block; margin: 0 auto;">
          <h2 class="text-center" style="font-family: 'Changa One', cursive; color: white;">Welcome to NVIDIA</h2>
          <p class="text-muted/ text-center" style="color: rgb(255, 255, 255);">Please register for an account</p>
      </div>

  
    <form style="background-color: hsla(120, 100%, 99%, 0.931); border-radius: 10px;"
      action="/Register.html" 
      method="POST"
      class="card w-50 p-4 d-flex flex-column gap-2 center w-auto mx-auto w-30  shadow"

    >
    <div>
      <label for="Fullname">Full Name</label>
      <input
        type="text"
        name="fullname"
        id="fullname"
        class="form-control"
        placeholder="enter your full name"
        required
      />
    </div>  

      <label for="Email">Email address</label>
      <input
        type="email"
        name="email"
        id="email"
        class="form-control"
        placeholder="enter your email"
        required
      />
      <label for="age" class="">Age</label>
      <input type="number" class="form-control" id="age" name="age" placeholder="enter your age" min ='1' max='40' required />
       
      <label for="radio" class="">Gender</label>
      <div class="form-check">
       <input type="radio" class="form-check-input" id="male" name="gender" value="male">
       <label for="male">Male</label>
      </div>
      <div class="form-check">
       <input type="radio" class="form-check-input" id="female" name="gender" value="female">
       <label for="female">Female</label>
      </div>

      <label for=" Password">Password</label>
      <input
        type="password"
        name="password"
        id="password"
        class="form-control"
        placeholder="Create your password"
        minlength="8" maxlength="20"
        required
      />
       <label for="password" class="">Confirm Password</label>
       <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat your password" minlength="8" maxlength="20" required />


        <label for="Country" class="">Country</label>
        <select name="country" id="country" class="form-control">
          <option value="">Select a country</option>
          <option value="us">United States</option>
          <option value="ca">Canada</option>
          <option value="uk">United Kingdom</option>
          <option value="cb">Cambodia</option>
        </select>


      <label for="Date">Date</label>
      <input type="date" class="form-control" id="date" />
      
        <label for="texarea" class="">short message</label>
        <textarea name="textarea" id="textarea" class="form-control" placeholder="Write your message here..." rows="3"></textarea>

        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="terms" name="terms" required />
          <label for="terms" class="">I agree to the terms and conditions</label>
        </div>


      <button type="submit" class="btn btn-success" style="gap:-3px;">Register</button>
      <button type="reset" class="btn btn-danger">Reset</button>
     
    </form>

     <a href="/login.html" class="text-decoration-none" style="color: rgb(255, 255, 255);" text-align="center" 
      ><u>Already have an account? Log in</u></a>
  </body>
</html>
